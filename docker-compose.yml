services:
  downloader:
    build: .
    container_name: py4k_downloader
    environment:
      - DISPLAY=${DISPLAY}
      - FLET_SERVER_PORT=8550
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - ./src:/app/src
      - ./downloads:/app/downloads
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host